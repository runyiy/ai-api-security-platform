name: Backend tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  collection:
    outputs:
      full_sha256: ${{ steps.collection.outputs.full_sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://ci_collection:ci_collection@localhost:5432/ci_collection

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci_collection
          POSTGRES_USER: ci_collection
          POSTGRES_PASSWORD: ci_collection
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_collection -d ci_collection"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Verify complete disjoint collections
        id: collection
        run: python -m ci_shards check --output collection.json

  w2:
    needs: collection
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://ci_w2:ci_w2@localhost:5432/ci_w2

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci_w2
          POSTGRES_USER: ci_w2
          POSTGRES_PASSWORD: ci_w2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_w2 -d ci_w2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run serial w2 partition
        env:
          EXPECTED_COLLECTION_SHA256: ${{ needs.collection.outputs.full_sha256 }}
        run: python -m ci_shards run w2 --expected-sha256 "$EXPECTED_COLLECTION_SHA256"

  remaining:
    needs: collection
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://ci_remaining:ci_remaining@localhost:5432/ci_remaining

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci_remaining
          POSTGRES_USER: ci_remaining
          POSTGRES_PASSWORD: ci_remaining
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_remaining -d ci_remaining"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Install bubblewrap from runner distribution
        timeout-minutes: 3
        run: |
          timeout --kill-after=5s 60s sudo -n apt-get update || {
            echo '::error::N1_BUBBLEWRAP_INSTALL_FAILED: distribution package index update failed or timed out'
            exit 1
          }
          timeout --kill-after=5s 90s sudo -n apt-get install --yes --no-install-recommends bubblewrap || {
            echo '::error::N1_BUBBLEWRAP_INSTALL_FAILED: distribution package installation failed or timed out'
            exit 1
          }
          command -v bwrap || {
            echo '::error::N1_BUBBLEWRAP_REQUIRED: installed executable is not discoverable'
            exit 1
          }
          timeout --kill-after=2s 5s bwrap --version

      - name: Verify required N1 sandbox capabilities
        timeout-minutes: 1
        run: |
          env -i PATH="$PATH" LANG=C.UTF-8 python -I - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import textwrap
          import time

          def diagnose(started):
              # Best-effort read-only evidence must never replace the probe error.
              try:
                  import runpy
                  diagnostics = runpy.run_path('../.github/scripts/n1_runtime_diagnostics.py')
                  diagnostics['report'](started, time.time())
              except Exception:
                  print('N1_DIAGNOSTIC unavailable; original capability failure retained', file=sys.stderr)

          sys.path.insert(0, str(Path.cwd()))
          from tests.ai.n1_sandbox import Sandbox

          # Use the adopted profile and selected Python runtime, without a DB or
          # application imports. Only this fixed synthetic probe exposes stderr.
          with tempfile.TemporaryDirectory(prefix='n1-ci-capability-') as directory:
              root = Path(directory)
              code, database, call = (root / name for name in ('code', 'database', 'call'))
              for path in (code, database, call):
                  path.mkdir()
              namespaces = {name: os.readlink('/proc/self/ns/' + name)
                            for name in ('user', 'pid', 'net', 'ipc', 'uts', 'mnt')}
              (code / 'child.py').write_text('parent_namespaces = ' + repr(namespaces) + '\n' + textwrap.dedent('''
                  import ctypes, errno, os
                  from pathlib import Path
                  for name, parent in parent_namespaces.items():
                      assert os.readlink('/proc/self/ns/' + name) != parent, 'N1_NAMESPACE_NOT_ISOLATED: ' + name
                  status = dict(line.split(':', 1) for line in Path('/proc/self/status').read_text().splitlines())
                  for name in ('CapInh', 'CapPrm', 'CapEff', 'CapBnd', 'CapAmb'):
                      assert int(status[name].strip(), 16) == 0, 'N1_CAPABILITIES_NOT_DROPPED: ' + name
                  assert status['NoNewPrivs'].strip() == '1', 'N1_NO_NEW_PRIVILEGES_REQUIRED'
                  libc = ctypes.CDLL(None, use_errno=True)
                  assert libc.unshare(0x10000000) == -1 and ctypes.get_errno() in (errno.EPERM, errno.ENOSPC), 'N1_NESTED_USERNS_NOT_DENIED'
                  assert list(Path('/tmp').iterdir()) == [], 'N1_PRIVATE_TMP_REQUIRED'
                  Path('/tmp/probe').write_text('synthetic')
                  try:
                      Path('/code/forbidden').write_text('synthetic')
                  except OSError as error:
                      assert error.errno == errno.EROFS, 'N1_READ_ONLY_CODE_REQUIRED'
                  else:
                      raise RuntimeError('N1_READ_ONLY_CODE_REQUIRED')
                  print('N1_CAPABILITY_OK')
              '''))
              started = time.time()
              try:
                  result = subprocess.run(Sandbox(code, database, call).command('child.py'),
                                          stdin=subprocess.DEVNULL, capture_output=True, text=True,
                                          close_fds=True, env={'PATH': '/usr/bin:/bin'}, timeout=10)
              except subprocess.TimeoutExpired:
                  diagnose(started)
                  sys.exit('::error::N1_CAPABILITY_TIMEOUT: required sandbox did not complete within 10 seconds')
              if result.returncode != 0 or result.stdout.strip() != 'N1_CAPABILITY_OK':
                  print(result.stderr[:4096], file=sys.stderr)
                  diagnose(started)
                  sys.exit('::error::N1_CAPABILITY_FAILED: required sandbox profile unavailable; inspect the diagnostic above; host security controls must remain enabled')
              print('N1_CAPABILITY_OK: isolated user/PID/network/IPC/UTS/mount namespaces, zero capabilities, no-new-privileges, denied nested user namespaces, private writable tmp and read-only code')
          PY

      - name: Run serial remaining partition
        env:
          EXPECTED_COLLECTION_SHA256: ${{ needs.collection.outputs.full_sha256 }}
        run: python -m ci_shards run remaining --expected-sha256 "$EXPECTED_COLLECTION_SHA256"

  pytest:
    name: pytest
    if: ${{ always() }}
    needs: [collection, w2, remaining]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require complete successful validation
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python backend/ci_shards.py gate
