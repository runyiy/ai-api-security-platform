name: Backend tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://security_app:security_app@localhost:5432/security_platform

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: security_platform
          POSTGRES_USER: security_app
          POSTGRES_PASSWORD: security_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U security_app -d security_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run backend test suite
        run: pytest
