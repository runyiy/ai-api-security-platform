services:
  db:
    image: postgres:16
    container_name: ai_security_postgres

    environment:
      POSTGRES_DB: security_platform
      POSTGRES_USER: security_app
      POSTGRES_PASSWORD: security_app

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security_app -d security_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
